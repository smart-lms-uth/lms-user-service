spring.application.name=lms-user-service

# Server Configuration
server.port=8080

# ===== DATABASE CONFIGURATION =====
# PostgreSQL (Primary - User Profiles)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/lms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tdthanhdev}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tdthanhdev2025}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== MONGODB CONFIGURATION (Activity Logs) =====
spring.data.mongodb.uri=${MONGODB_URI:mongodb://admin:admin2025@localhost:27017/lms_activities?authSource=admin}
spring.data.mongodb.database=${MONGODB_DATABASE:lms_activities}

# ===== REDIS CONFIGURATION (Caching) =====
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis2025}
spring.data.redis.timeout=2000ms
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# ===== RABBITMQ CONFIGURATION (Async Messaging) =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:lms_user}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:lms_pass2025}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Activity Queue Configuration
app.rabbitmq.queue.activity=activity.logs
app.rabbitmq.exchange.activity=activity.exchange
app.rabbitmq.routing-key.activity=activity.routing.key

# ===== SECURITY CONFIGURATION =====
# JWT Configuration - Default value for local development
jwt.secret=${JWT_SECRET:V7a+pUOvn9WaiJVrX7J0IJLzhgkx52ok6LbR3jUBpTj3U+7F6V71XKOuVcKlSf7I13gA81bhFRcQ7uxwa4X/SA==}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.issuer=${JWT_ISSUER:lms-user-service}

# OAuth2 Configuration - Google
# Set via environment variables GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
# Khi chạy local, redirect qua Gateway port 8888
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8888/login/oauth2/code/google

# OAuth2 Frontend callback URL
app.oauth2.authorized-redirect-uris=${OAUTH2_REDIRECT_URIS:http://localhost:4200/oauth2/callback}

# ===== ACTUATOR CONFIGURATION =====
management.endpoints.web.exposure.include=health,info,metrics,caches
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.mongo.enabled=true
management.health.rabbit.enabled=true

# ===== ASYNC CONFIGURATION =====
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=ActivityLog-

# ===== DEFAULT ADMIN CONFIGURATION =====
app.admin.email=${ADMIN_EMAIL:admin@uth.edu.vn}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

# ===== CORS CONFIGURATION =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# ===== RATE LIMITING =====
app.rate-limit.login.limit=5
app.rate-limit.login.duration-minutes=1
app.rate-limit.api.limit=100
app.rate-limit.api.duration-minutes=1
app.rate-limit.register.limit=3
app.rate-limit.register.duration-hours=1

# ===== SERVER CONFIGURATION =====
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===== FILE UPLOAD CONFIGURATION =====
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.base-url=${UPLOAD_BASE_URL:http://localhost:8080}

# ===== EMAIL CONFIGURATION =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tdthanh.dev2025@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dppcorzacaxfdcrk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.enabled=${MAIL_ENABLED:true}

app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:UTH LMS <tdthanh.dev2025@gmail.com>}

# ===== LOGGING CONFIGURATION =====
logging.level.root=INFO
logging.level.uth.edu.vn.lms_user_service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
